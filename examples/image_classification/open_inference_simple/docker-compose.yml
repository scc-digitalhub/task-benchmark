name: image-classification-open-inference

services:
  open-inference-vit:
    build:
      context: .
      dockerfile: Dockerfile-vit
    ports:
      - "9090:9090"
    environment:
      OPEN_INFERENCE_MODEL: ${OPEN_INFERENCE_MODEL:-nateraw/vit-base-patch16-224-cifar10}
      OPEN_INFERENCE_HOST: 0.0.0.0
      OPEN_INFERENCE_PORT: "9090"
      OPEN_INFERENCE_DEVICE: cpu
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - open_inference_model_cache:/root/.cache/huggingface

  open-inference-resnet:
    build:
      context: .
      dockerfile: Dockerfile-resnet
    ports:
      - "9091:8080"
    environment:
      OPEN_INFERENCE_MODEL: resnet18_cifar10
      OPEN_INFERENCE_MODEL_NAME: resnet18_cifar10
      OPEN_INFERENCE_HOST: 0.0.0.0
      OPEN_INFERENCE_PORT: "8080"
      OPEN_INFERENCE_DEVICE: cpu
    volumes:
      - open_inference_resnet_cache:/root/.cache/torch

volumes:
  open_inference_model_cache:
  open_inference_resnet_cache:
