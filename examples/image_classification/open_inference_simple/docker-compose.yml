services:
  open-inference-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      OPEN_INFERENCE_MODEL: ${OPEN_INFERENCE_MODEL:-nateraw/vit-base-patch16-224-cifar10}
      OPEN_INFERENCE_HOST: 0.0.0.0
      OPEN_INFERENCE_PORT: "9090"
      OPEN_INFERENCE_DEVICE: cpu
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - open_inference_model_cache:/root/.cache/huggingface

volumes:
  open_inference_model_cache:
